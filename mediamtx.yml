# MediaMTX Configuration for CCTV Monitoring Platform
api: yes
apiAddress: :9997

logLevel: info
logDestinations: [stdout]

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]

webrtc: yes
webrtcAddress: :8889

# ICE/UDP and TCP fallback port on IPv4 to prevent unroutable fe80:: IPv6 link-local candidates
webrtcLocalUDPAddress: 0.0.0.0:8189
webrtcLocalTCPAddress: 0.0.0.0:8189

# Only advertise public IP / domain — blocks internal Docker bridge IP from ICE candidates
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts:
  - 200.141.12.143
  - api-cctv-backend.duckdns.org

webrtcAllowOrigins:
  - '*'
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

hls: yes
hlsAddress: :8888
hlsAllowOrigins:
  - '*'
hlsPartDuration: 200ms
hlsSegmentDuration: 1s
hlsSegmentCount: 7

paths:
  all:
    source: publisher
    maxReaders: 50

  # ── Standardized Dynamic Camera Ingestion & Audio Transcoding ─────────────────
  # Automatically transcodes incoming camera audio (AAC/PCM) to Opus for instant WebRTC browser playback.
  # Video (H.264) is stream-copied (-c:v copy) for sub-millisecond latency and zero CPU re-encoding.
  # Works dynamically for ANY camera onboarded without modifying mediamtx.yml!
  #
  # Standard Pattern 1 (Prefix): raw_<name> -> live_<name>
  "~^raw_([a-zA-Z0-9_-]+)$":
    source: publisher
    runOnAvailable: ffmpeg -rtsp_transport tcp -i rtsp://127.0.0.1:8554/raw_$G1 -c:v copy -c:a libopus -b:a 64k -async 50 -f rtsp rtsp://127.0.0.1:8554/live_$G1
    runOnAvailableRestart: yes
    record: yes
    recordPath: /app/recordings/%path/%Y-%m-%d_%H-%M-%S
    recordFormat: fmp4
    recordPartDuration: 1s
    recordSegmentDuration: 120s
    recordDeleteAfter: 2h

  # Standard Pattern 2 (Suffix): <name>_raw -> <name>_live
  "~^([a-zA-Z0-9_-]+)_raw$":
    source: publisher
    runOnAvailable: ffmpeg -rtsp_transport tcp -i rtsp://127.0.0.1:8554/$G1_raw -c:v copy -c:a libopus -b:a 64k -async 50 -f rtsp rtsp://127.0.0.1:8554/$G1_live
    runOnAvailableRestart: yes
    record: yes
    recordPath: /app/recordings/%path/%Y-%m-%d_%H-%M-%S
    recordFormat: fmp4
    recordPartDuration: 1s
    recordSegmentDuration: 120s
    recordDeleteAfter: 2h

  # Standard Pattern 3 (Slash): raw/<name> -> live/<name>
  "~^raw/([a-zA-Z0-9_-]+)$":
    source: publisher
    runOnAvailable: ffmpeg -rtsp_transport tcp -i rtsp://127.0.0.1:8554/raw/$G1 -c:v copy -c:a libopus -b:a 64k -async 50 -f rtsp rtsp://127.0.0.1:8554/live/$G1
    runOnAvailableRestart: yes
    record: yes
    recordPath: /app/recordings/%path/%Y-%m-%d_%H-%M-%S
    recordFormat: fmp4
    recordPartDuration: 1s
    recordSegmentDuration: 120s
    recordDeleteAfter: 2h

  # Legacy compatibility for initial test cameras
  phone_cam:
    source: publisher
    runOnAvailable: ffmpeg -rtsp_transport tcp -i rtsp://127.0.0.1:8554/phone_cam -c:v copy -c:a libopus -b:a 64k -async 50 -f rtsp rtsp://127.0.0.1:8554/phone_cam_live
    runOnAvailableRestart: yes
    record: yes
    recordPath: /app/recordings/%path/%Y-%m-%d_%H-%M-%S
    recordFormat: fmp4
    recordPartDuration: 1s
    recordSegmentDuration: 120s
    recordDeleteAfter: 2h

  phone_cam_1:
    source: publisher
    runOnAvailable: ffmpeg -rtsp_transport tcp -i rtsp://127.0.0.1:8554/phone_cam_1 -c:v copy -c:a libopus -b:a 64k -async 50 -f rtsp rtsp://127.0.0.1:8554/phone_cam_1_live
    runOnAvailableRestart: yes
    record: yes
    recordPath: /app/recordings/%path/%Y-%m-%d_%H-%M-%S
    recordFormat: fmp4
    recordPartDuration: 1s
    recordSegmentDuration: 120s
    recordDeleteAfter: 2h

  # Talkback sessions: browser WHIP publishers
  # Matches any path like camera_<objectid>_talkback
  "~^camera_[a-z0-9]+_talkback$":
    source: publisher
    maxReaders: 5
    record: no
