# MediaMTX Configuration for CCTV Monitoring Platform
api: yes
apiAddress: :9997

logLevel: info
logDestinations: [stdout]

rtsp: yes
rtspAddress: :8554
protocols: [tcp, udp]

webrtc: yes
webrtcAddress: :8889

# ICE/UDP media transmission port (separate from HTTP signaling on :8889 to avoid socket collision)
webrtcLocalUDPAddress: :8890
webrtcLocalTCPAddress: ""

# Only advertise public IP / domain — blocks internal Docker bridge IP from ICE candidates
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts:
  - api-cctv-backend.duckdns.org
  - 200.141.12.143

webrtcAllowOrigin: '*'
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

hls: yes
hlsAddress: :8888
hlsAllowOrigin: '*'
hlsPartDuration: 200ms
hlsSegmentDuration: 1s
hlsSegmentCount: 7

paths:
  all:
    source: publisher
    maxReaders: 50

  # Talkback sessions: browser WHIP publishers
  # Matches any path like camera_<objectid>_talkback
  "~^camera_[a-z0-9]+_talkback$":
    source: publisher
    maxReaders: 5
    record: no
