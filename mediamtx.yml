# MediaMTX Configuration for CCTV Monitoring Platform
api: yes
apiAddress: :9997

logLevel: info
logDestinations: [stdout]

rtsp: yes
rtspAddress: :8554
protocols: [tcp, udp]

webrtc: yes
webrtcAddress: :8889

# ICE/UDP on same port as HTTP signaling to avoid port confusion
webrtcLocalUDPAddress: :8889
webrtcLocalTCPAddress: ""

# Only advertise public IP — blocks Docker bridge IP (172.17.0.1) from ICE candidates
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts:
  - 200.141.12.143

webrtcAllowOrigin: '*'
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

hls: yes
hlsAddress: :8888
hlsAllowOrigin: '*'
hlsPartDuration: 200ms
hlsSegmentDuration: 1s
hlsSegmentCount: 7

paths:
  all:
    source: publisher
    maxReaders: 50
