# MediaMTX Configuration for CCTV Monitoring Platform
api: yes
apiAddress: :9997

# Logging
logLevel: info
logDestinations: [stdout]

# RTSP Server (allows local synthetic feeds & external IP cameras)
rtsp: yes
rtspAddress: :8554
protocols: [tcp, udp]

# WebRTC (WHEP / WHIP)
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: '*'
webrtcLocalUDPAddress: :8189
# If deployed on a cloud VPS behind 1:1 NAT (like Oracle Cloud, AWS, GCP),
# set MTX_WEBRTCADDITIONALHOSTS=your_public_ip in your environment / docker-compose.
webrtcAdditionalHosts: []

# HLS
hls: yes
hlsAddress: :8888

# Default path config to allow dynamic paths created via API
paths:
  all:
    source: publisher
    maxReaders: 50

