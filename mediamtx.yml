# MediaMTX Configuration for CCTV Monitoring Platform
api: yes
apiAddress: :9997

# Logging
logLevel: info
logDestinations: [stdout]

# RTSP Server
rtsp: yes
rtspAddress: :8554
protocols: [tcp, udp]

# WebRTC (WHEP / WHIP)
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: '*'

# Default path config to allow dynamic paths created via API
paths:
  all:
    source: publisher
    maxReaders: 50
