# MediaMTX Configuration for CCTV Monitoring Platform
api: yes
apiAddress: :9997

logLevel: info
logDestinations: [stdout]

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]

webrtc: yes
webrtcAddress: :8889

# ICE/UDP and TCP fallback port on IPv4 to prevent unroutable fe80:: IPv6 link-local candidates
webrtcLocalUDPAddress: 0.0.0.0:8189
webrtcLocalTCPAddress: 0.0.0.0:8189

# Only advertise public IP / domain — blocks internal Docker bridge IP from ICE candidates
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts:
  - 200.141.12.143
  - api-cctv-backend.duckdns.org

webrtcAllowOrigins:
  - '*'
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

hls: yes
hlsAddress: :8888
hlsAllowOrigins:
  - '*'
hlsPartDuration: 200ms
hlsSegmentDuration: 1s
hlsSegmentCount: 7

paths:
  all:
    source: publisher
    maxReaders: 50

  # Auto-transcode incoming phone AAC audio to Opus for instant WebRTC browser playback
  phone_cam:
    source: publisher
    runOnReady: ffmpeg -rtsp_transport tcp -i rtsp://127.0.0.1:8554/phone_cam -c:v copy -c:a libopus -b:a 64k -async 50 -f rtsp rtsp://127.0.0.1:8554/phone_cam_live
    runOnReadyRestart: yes

  phone_cam_1:
    source: publisher
    runOnReady: ffmpeg -rtsp_transport tcp -i rtsp://127.0.0.1:8554/phone_cam_1 -c:v copy -c:a libopus -b:a 64k -async 50 -f rtsp rtsp://127.0.0.1:8554/phone_cam_1_live
    runOnReadyRestart: yes

  # Talkback sessions: browser WHIP publishers
  # Matches any path like camera_<objectid>_talkback
  "~^camera_[a-z0-9]+_talkback$":
    source: publisher
    maxReaders: 5
    record: no
