# MediaMTX Configuration for CCTV Monitoring Platform
api: yes
apiAddress: 127.0.0.1:9997

# Logging
logLevel: info
logDestinations: [stdout]

# RTSP Server (internal)
rtsp: yes
rtspAddress: 127.0.0.1:8554
protocols: [tcp, udp]

# WebRTC (WHEP / WHIP - internal loopback)
webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcAllowOrigin: '*'
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# High-Performance Low-Latency HLS (LL-HLS)
hls: yes
hlsAddress: 127.0.0.1:8888
hlsAllowOrigin: '*'
hlsPartDuration: 200ms
hlsSegmentDuration: 1s
hlsSegmentCount: 7

# Default path config to allow dynamic paths created via API
paths:
  all:
    source: publisher
    maxReaders: 50
